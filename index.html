*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tinta);font-family:'Poppins',system-ui,sans-serif;font-size:14px;line-height:1.4;letter-spacing:.1px}
#app{max-width:480px;margin:0 auto;position:relative}
#cab{position:relative}
.esc{position:absolute;left:0;top:0;width:100%;height:150px;z-index:0}
body.noche .esc.f{filter:brightness(.72) saturate(.9)}
.top{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0;height:64px}
.ttl{font-weight:600;font-size:15px} .sub{font-size:12px;font-weight:500}
.chipm{display:flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:999px;background:var(--chipbg);border:2px solid var(--mad);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;font-family:inherit;color:var(--tinta);cursor:pointer}
.sdot{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--chipbg);background:#9aa0a6}.sdot.ok{background:#3f8a4e}.sdot.pend{background:#e0a526}.sdot.error{background:#c0392b}.sdot.off{display:none}
.ibtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--mad);background:var(--chipbg);color:var(--tinta);display:grid;place-items:center;padding:0;cursor:pointer}
.cont{position:relative;z-index:1;padding:0 14px 110px;display:flex;flex-direction:column;gap:14px;margin-top:66px}
.perg{position:relative;background:var(--perg);border:2px solid var(--mad);border-radius:18px;padding:16px;box-shadow:0 4px 0 var(--sombra)}
h2,.h{font-family:'MedievalSharp','Poppins',serif;font-weight:400;font-size:19px;margin:0}
.lbl{font-size:11px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
.dim{color:var(--dim)} .sm{font-size:12px} .num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-top:1.5px solid var(--track)}
.row.f{border-top:none}
.btn{min-height:44px;padding:0 14px;border-radius:14px;border:2px solid var(--mad);background:var(--perg2);color:var(--tinta);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn.on{background:var(--oro);color:#3b2a1a;border-color:var(--oro2)}
.btn.pri{background:var(--oro);color:#3b2a1a;border-color:var(--oro2);box-shadow:0 3px 0 var(--oro2)}
.btn.mal{color:var(--mal)} .btn[disabled]{opacity:.5}
.pill{display:inline-block;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;border:1.5px solid var(--mad);background:var(--perg2)}
.pill.ok{color:var(--ok);border-color:var(--ok)} .pill.warn{color:var(--mal);border-color:var(--mal)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.sw2{width:50px;height:30px;border-radius:15px;background:var(--track);border:2px solid var(--mad);position:relative;flex:0 0 auto;cursor:pointer;padding:0}
.sw2 i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid var(--mad);transition:left .15s}
.sw2.on{background:var(--ok)} .sw2.on i{left:22px}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--tinta);background:var(--bg);border:2px solid var(--mad);border-radius:12px;padding:0 10px;min-height:44px;max-width:100%}
input[type=range]{padding:0;min-height:30px;width:140px;accent-color:var(--oro2)}
input.w,select.w{width:100%} .r{text-align:right} input.m{width:110px}
.mic{width:88px;height:88px;border-radius:50%;border:3px solid var(--oro2);background:var(--oro);color:#3b2a1a;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 0 0 9px rgba(224,165,38,.28),0 0 0 19px rgba(224,165,38,.13),0 5px 0 var(--oro2)}
.mic.esc2{animation:lat 1s infinite}
@keyframes lat{50%{transform:scale(1.07)}}
.rev{display:flex;align-items:center;gap:8px;min-height:44px;border:none;background:transparent;padding:0;margin:0;cursor:pointer;text-align:left;font-family:'MedievalSharp','Poppins',serif;font-size:32px;line-height:1.1;color:var(--tinta);font-variant-numeric:tabular-nums}
.cifra{cursor:pointer}
.ib{width:44px;height:44px;border-radius:14px;border:2px solid var(--mad);background:var(--perg);color:var(--tinta);font-size:20px;cursor:pointer;font-family:inherit}
.ej{display:inline-block;border:1.5px dashed var(--mad);border-radius:12px;padding:6px 10px;margin:4px 6px 0 0;font-size:12px;background:transparent;color:var(--tinta);font-family:inherit;cursor:pointer;text-align:left}
.segm{display:flex;border:2px solid var(--mad);border-radius:12px;overflow:hidden}
.segm button{min-height:44px;min-width:52px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.segm button.on{background:var(--oro);color:#3b2a1a}
.meta{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1.5px solid var(--track);cursor:pointer}
.track{height:12px;border-radius:7px;background:var(--track);overflow:hidden;border:1.5px solid var(--mad)}
.fill{height:100%}
.fecha{width:48px;height:52px;flex:0 0 auto;border-radius:12px;border:2px solid var(--mad);background:var(--perg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'MedievalSharp','Poppins',serif;font-size:18px;line-height:1.05}

.pago{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1.5px solid var(--track)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}

.mov{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1.5px solid var(--track);cursor:pointer}

.leg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1.5px solid var(--track)}
.sq{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--mad);flex:0 0 auto}
.g1{flex:1;min-width:0} .g1 .a{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tb.on{background:var(--oro);color:#3b2a1a}

#capa{position:fixed;inset:0;z-index:40;display:none;background:rgba(20,14,6,.55)}
#capa.on{display:block}
.hoja{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border:2px solid var(--mad);border-radius:22px 22px 0 0;padding:16px 14px 28px}
.full{position:absolute;inset:0;max-width:480px;margin:0 auto;overflow:auto;background:var(--bg);padding:0 14px 40px}
.full>.perg{margin-top:14px}
.top2{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.top2 .t{flex:1;font-weight:600;font-size:16px}
.tabs{display:flex;gap:6px;overflow:auto;padding:4px 0 8px}
.tabs .btn{white-space:nowrap}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:10px} .fld>label{font-size:12px;color:var(--dim);font-weight:600}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--tinta);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.card2{border:1.5px solid var(--mad);border-radius:14px;padding:10px;margin-top:10px;background:var(--perg)}
details>summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center;justify-content:space-between;list-style:none}
details>summary::-webkit-details-marker{display:none}

function candidatosMonto(t){
  const c=[];

    if(/^\d{1,3}(?:[ .,]\d{3})+(?:[.,]\d{1,2})?$/.test(raw)){
      v=parseFloat(raw.replace(/[ .,](?=\d{3}(?!\d))/g,'').replace(',','.'));
    }else v=parseFloat(raw.replace(',','.'));
    const fin=m.index+m[0].length;
    if(!isNaN(v))c.push({v,i:m.index,fin,s:/^\s*(soles|sol|lucas)\b/.test(t.slice(fin))||m[1]!==undefined});
  }
  const ws=[...t.matchAll(/[a-z]+/g)];
  for(let k=0;k<ws.length;k++){
    const w=ws[k][0];
    if(['un','uno','una'].includes(w)&&ws[k+1]&&ws[k+1][0]==='sol'){c.push({v:1,i:ws[k].index,fin:ws[k+1].index+3,s:true});k++;continue}
    if(!esNumPal(w))continue;
    const run=[w];let j=k+1;
    while(j<ws.length&&(esNumPal(ws[j][0])||(ws[j][0]==='y'&&j+1<ws.length&&esNumPal(ws[j+1][0])))){run.push(ws[j][0]);j++}
    const v=valorPalabras(run);const fin=ws[j-1].index+ws[j-1][0].length;
    c.push({v,i:ws[k].index,fin,s:/^\s*(soles|sol)\b/.test(t.slice(fin))});
    k=j-1;
  }
  return c;
}
function elegirMonto(t){

  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));

function clasificar(t){
  const kws=compilarKW(), hit=[];
  kws.forEach(k=>{const m=k.re.exec(t);if(m)hit.push({cat:k.cat,sub:k.sub,w:k.w,pos:m.index})});
  if(!hit.length){
    // errores de reconocimiento: una letra de diferencia
    const toks=(t.match(/[a-z]{5,}/g)||[]).filter(w=>!STOP.has(w));
    for(const w of toks){
      const k=kws.find(x=>!x.kw.includes(' ')&&x.kw.length>=5&&lev(x.kw,w)<=1);
      if(k)hit.push({cat:k.cat,sub:k.sub,w:1,pos:t.indexOf(w)});
    }
  }
  if(!hit.length)return {cat:'',sub:[]};
  const pt={},first={};
  hit.forEach(h=>{pt[h.cat]=(pt[h.cat]||0)+h.w;if(first[h.cat]==null||h.pos<first[h.cat])first[h.cat]=h.pos});
  const cat=Object.keys(pt).sort((a,b)=>pt[b]-pt[a]||first[a]-first[b])[0];
  const subs=[];hit.filter(h=>h.cat===cat&&h.sub).sort((a,b)=>a.pos-b.pos).forEach(h=>{if(!subs.includes(h.sub))subs.push(h.sub)});
  const validas=(catDe(cat).sub||[]);
  return {cat,sub:subs.filter(s=>validas.includes(s))};
}
function adivinarPalabra(t){
  const toks=(t.match(/[a-z]{3,}/g)||[]).filter(w=>!STOP.has(w)&&!esNumPal(w));
  return toks.length?toks[toks.length-1]:'';
}

function entender(texto,hoyS){
  hoyS=hoyS||hoy();
  const orig=String(texto||'').trim();
  let t=' '+norm(orig).replace(/[¿?¡!;:()"«»]/g,' ').replace(/[.,](?=\s|$)/g,' ')+' ';
  const r={tipo:'gasto',monto:0,cat:'',sub:[],fecha:hoyS,c:'',c2:'',nota:orig,aviso:'',entendido:false,fechaDicha:false,pista:''};
  const hallados=[];
  S.cfg.cuentas.forEach(cu=>{
    const n=norm(cu.n).trim();if(!n)return;
    const re=new RegExp('(^|[^a-z])('+escRe(n)+')(?![a-z])','g');
    let m;
    while((m=re.exec(t))){
      const ini=m.index+m[1].length;
      const antes=t.slice(0,ini).trim().split(/\s+/).slice(-4).filter(w=>w!=='cuenta'&&w!=='tarjeta'&&w!=='la'&&w!=='mi');
      const prep=antes.length&&PREP.includes(antes[antes.length-1])?antes[antes.length-1]:'';
      hallados.push({id:cu.id,pos:ini,fin:ini+n.length,prep});
    }
  });
  hallados.sort((a,b)=>a.pos-b.pos);
  const esTras=/(traspas|transfer|\bpase\b|\bmovi\b|\bmande\b|\benvie\b|\bcambie\b|traslad)/.test(t);
  const esIng=/\b(cobre|cobro|me pagaron|me depositaron|me abonaron|recibi|me llego|ingreso|ingrese)\b/.test(t);
  if(esTras&&hallados.length>=2){
    r.tipo='traspaso';
    let o=hallados.find(h=>h.prep==='de'||h.prep==='desde');
    let d=hallados.find(h=>['a','hacia','para','en','con'].includes(h.prep)&&(!o||h.id!==o.id));
    if(!o&&!d){o=hallados[0];d=hallados.find(h=>h.id!==o.id)}
    else if(o&&!d)d=hallados.find(h=>h.id!==o.id);
    else if(d&&!o)o=hallados.find(h=>h.id!==d.id);
    r.c=o.id;r.c2=d.id;
  }else if(esIng){
    r.tipo='ingreso';r.c=(hallados[0]||{}).id||S.cfg.cuentas[0].id;
  }else{
    r.c=(hallados[0]||{}).id||S.cfg.cuentaDef||S.cfg.cuentas[1].id;
  }
  hallados.slice().sort((a,b)=>b.pos-a.pos).forEach(h=>{t=t.slice(0,h.pos)+' '.repeat(h.fin-h.pos)+t.slice(h.fin)});
  const f=quitarFecha(t,hoyS);t=f.texto;r.fecha=f.fecha;r.aviso=f.aviso;r.fechaDicha=f.dicha;
  const mo=elegirMonto(t);
  if(mo){r.monto=mo.v;t=t.slice(0,mo.i)+' '.repeat(Math.max(0,mo.fin-mo.i))+t.slice(mo.fin)}
  if(r.tipo==='gasto'){
    const cl=clasificar(t);r.cat=cl.cat;r.sub=cl.sub;
    if(!r.cat)r.pista=adivinarPalabra(t);
  }
  r.entendido=r.monto>0&&(r.tipo!=='gasto'||!!r.cat);
  return r;
}
// varios gastos en una sola frase: "taxi 14 soles y almuerzo 18 soles"
function entenderMulti(texto,hoyS){
  hoyS=hoyS||hoy();
  const base=entender(texto,hoyS);
  const orig=String(texto||'');const n=norm(orig);
  if(n.length!==orig.length)return [base];
  const t=' '+n.replace(/[¿?¡!;:()"«»]/g,' ')+' ';
  const f=quitarFecha(t,hoyS);
  const cs=candidatosMonto(f.texto).filter(c=>c.s||/\b(por|a)\s*$/.test(f.texto.slice(0,c.i)));
  if(cs.length<2)return [base];
  const cortes=[0];
  for(let i=1;i<cs.length;i++){
    const a=cs[i-1].fin,b=cs[i].i;
    const tramo=f.texto.slice(a,b);
    let cut=-1,m,re=/(,|\sy\s|\se\s|\sademas\s|\stambien\s|\sluego\s|\sdespues\s)/g;
    while((m=re.exec(tramo)))cut=a+m.index+m[0].length;
    if(cut<0)return [base];
    cortes.push(cut-1);
  }
  cortes.push(orig.length);
  const out=[];
  for(let i=0;i<cortes.length-1;i++){
    const seg=orig.slice(cortes[i],cortes[i+1]).replace(/^[\s,y]+/i,'').trim();
    const r=entender(seg,hoyS);
    if(!r.fechaDicha&&base.fechaDicha)r.fecha=base.fecha;
    if(r.monto>0)out.push(r);
  }
  return out.length>=2?out:[base];
}

}
function barras(centro){
  const dias=[-3,-2,-1,0,1,2,3].map(k=>sumaDias(centro,k)), t=hoy();
  const vals=dias.map(f=>suma(gastos(x=>x.f===f)));
  const ideal=(+S.cfg.tope||0)/diasDelMes(centro.slice(0,7));
  const mx=Math.max(...vals,ideal*1.15,1), H=96, base=118;
  const yI=base-ideal/mx*H;
  const o=dias.map((f,i)=>{
    const futuro=f>t, v=vals[i], h=v>0?Math.max(4,v/mx*H):0, x=i*48+9, y=base-h, sel=i===3, hoyF=f===t;
    const col=v>ideal?'var(--mal)':'#b38b57';
    const d=new Date(f+'T12:00:00');
    return `<g data-act="dia" data-f="${f}" style="cursor:pointer" opacity="${futuro?.45:1}">
      <rect x="${i*48}" y="0" width="48" height="150" fill="transparent"/>
      ${h?`<rect x="${x}" y="${y}" width="30" height="${h}" rx="6" fill="${col}" ${sel?'stroke="var(--oro2)" stroke-width="2.5"':''}/>`:`<rect x="${x}" y="${base-3}" width="30" height="3" rx="1.5" fill="var(--track)"/>`}
      ${v>0?`<text x="${x+15}" y="${y-5}" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="Poppins">${oculto()?'••':fmt(Math.round(v))}</text>`:''}
      <text x="${x+15}" y="134" text-anchor="middle" font-size="10" fill="currentColor" font-family="Poppins" ${hoyF||sel?'font-weight="700"':''}>${DIAS[d.getDay()].slice(0,3)}</text>
      <text x="${x+15}" y="146" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7" font-family="Poppins">${d.getDate()}</text>
    </g>`}).join('');
  return `<svg viewBox="0 0 336 150" width="100%" role="img" aria-label="Gasto por día"><path d="M0 ${base} H336" stroke="var(--track)" stroke-width="2"/>${o}<path d="M0 ${yI} H336" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6 5" pointer-events="none"/><text x="334" y="${yI-4}" text-anchor="end" font-size="9" font-weight="700" fill="var(--ok)" font-family="Poppins">ideal ${oculto()?'••':fmt(Math.round(ideal))}</text></svg>`;
}
function barrasMes(ym){
  const dm=diasDelMes(ym), t=hoy(), ideal=(+S.cfg.tope||0)/dm;
  const vals=Array.from({length:dm},(_,i)=>suma(gastos(x=>x.f===ym+'-'+pad(i+1))));
  const mx=Math.max(...vals,ideal*1.15,1), H=90, base=106, w=336/dm, bw=Math.max(3,w-3);
  const yI=base-ideal/mx*H;
  const b=vals.map((v,i)=>{const h=v>0?Math.max(2,v/mx*H):0, f=ym+'-'+pad(i+1), x=i*w+(w-bw)/2;
    return h?`<rect x="${x.toFixed(1)}" y="${base-h}" width="${bw.toFixed(1)}" height="${h}" rx="${Math.min(3,bw/2)}" fill="${v>ideal?'var(--mal)':'#b38b57'}" opacity="${f>t?.4:1}"/>`:''}).join('');
  const lab=[1,8,15,22,29].filter(n=>n<=dm).map(n=>`<text x="${((n-1)*w+w/2).toFixed(1)}" y="122" text-anchor="middle" font-size="9" fill="currentColor" opacity=".7" font-family="Poppins">${n}</text>`).join('');
  return `<svg viewBox="0 0 336 128" width="100%" role="img" aria-label="Gasto de cada día del mes"><path d="M0 ${base} H336" stroke="var(--track)" stroke-width="2"/>${b}<path d="M0 ${yI} H336" stroke="var(--ok)" stroke-width="2" stroke-dasharray="6 5"/><text x="334" y="${yI-4}" text-anchor="end" font-size="9" font-weight="700" fill="var(--ok)" font-family="Poppins">ideal ${oculto()?'••':fmt(Math.round(ideal))}</text>${lab}</svg>`;
}
function resumenMesStats(ym){
  const g=gastos(x=>x.f.startsWith(ym)), tot=suma(g), dm=diasDelMes(ym);
  const porDia={};g.forEach(x=>porDia[x.f]=(porDia[x.f]||0)+(+x.m));
  const dias=Object.entries(porDia).sort((a,b)=>a[1]-b[1]);
  const ant=suma(gastos(x=>x.f.startsWith(sumaMes(ym,-1))));
  const sem=[0,0,0,0,0];g.forEach(x=>{sem[Math.min(4,Math.floor((+x.f.slice(8,10)-1)/7))]+=+x.m});
  return {g,tot,dm,dias,ant,sem,cats:porGrupo(g),
    ingresos:suma(S.movs.filter(x=>x.t==='ingreso'&&x.f.startsWith(ym))),
    tras:suma(S.movs.filter(x=>x.t==='traspaso'&&x.f.startsWith(ym)))};
}

function celda(v){v=String(v==null?'':v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function tablaMovs(){
  const h=['Fecha','Tipo','Monto','Categoría','Subetiquetas','Nota','Cuenta','Cuenta destino','Dictado'];
  const f=S.movs.slice().sort((a,b)=>a.f<b.f?-1:a.f>b.f?1:0).map(x=>[x.f,x.t,x.m,x.cat||'',(x.s||[]).join(' | '),x.nota||'',cuenta(x.c).n,x.c2?cuenta(x.c2).n:'',x.voz?'sí':'no']);
  return [h].concat(f);
}
function tablaResumen(){
  const meses=[...new Set(S.movs.map(x=>x.f.slice(0,7)))].sort();
  const cats=S.cfg.cats.map(c=>c.n);
  const h=['Mes','Ingresos','Gastos','Traspasos'].concat(cats);
  return [h].concat(meses.map(m=>{const g=gastos(x=>x.f.startsWith(m));return [m,suma(S.movs.filter(x=>x.t==='ingreso'&&x.f.startsWith(m))),suma(g),suma(S.movs.filter(x=>x.t==='traspaso'&&x.f.startsWith(m)))].concat(cats.map(c=>suma(g.filter(x=>x.cat===c))))}));
}
function descargar(nombre,texto,tipo){
  const b=new Blob([texto],{type:tipo||'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=nombre;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function exportar(k){
  if(k==='xlsx'){descargarBlob('finanzas-movimientos.xlsx',crearXlsx());toast('Excel listo');return}
  if(k==='copiar'){
    const tsv=tablaMovs().map(r=>r.map(c=>String(c).replace(/[\t\n]/g,' ')).join('\t')).join('\n');
    copiarTexto(tsv).then(()=>toast('Copiado. Pégalo en una hoja de cálculo'));return;
  }
  const t=(k==='movs'?tablaMovs():tablaResumen()).map(r=>r.map(celda).join(',')).join('\r\n');
  descargar(k==='movs'?'finanzas-movimientos.csv':'finanzas-resumen.csv','﻿'+t);toast('Archivo listo');
}
function copiarTexto(t){
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).catch(()=>viejoCopiar(t));
  return Promise.resolve(viejoCopiar(t));
}
function viejoCopiar(t){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}

/* grafico hacia fin de mes */
function grafProy(r){
  const W=279, esc=125/(r.tope||1), Y=v=>clamp(150-esc*v,-4,150), X=d=>(d-1)/Math.max(1,r.dm-1)*W;

  const xh=X(r.dh), yh=Y(r.gasto), yP=Y(r.proy), yR=Y(r.proy-r.recorte);
  const T=n=>oculto()?'••':fmt(Math.round(n));
  const marcas=[1,Math.round(r.dm/4),Math.round(r.dm/2),Math.round(r.dm*3/4),r.dm].map(d=>`<text x="${X(d)}" y="164">${d}</text>`).join('');
  return `<svg width="100%" viewBox="0 0 330 196" role="img" aria-label="Gasto acumulado del mes con proyección a fin de mes"><g transform="translate(36 18)" font-family="Poppins,sans-serif" font-size="9.5">
<line x1="0" y1="150" x2="${W}" y2="150" stroke="var(--mad)" stroke-width="1.5"/><line x1="0" y1="${Y(r.tope/2)}" x2="${W}" y2="${Y(r.tope/2)}" stroke="var(--track)"/>
<line x1="0" y1="${Y(r.tope)}" x2="${W}" y2="${Y(r.tope)}" stroke="var(--oro2)" stroke-width="2"/>
<text x="-6" y="153" text-anchor="end" fill="var(--dim)">0</text><text x="-6" y="${Y(r.tope/2)+4}" text-anchor="end" fill="var(--dim)">${T(r.tope/2)}</text><text x="-6" y="${Y(r.tope)+4}" text-anchor="end" fill="var(--dim)">${T(r.tope)}</text>
<text x="4" y="${Y(r.tope)-7}" fill="var(--oro2)" font-weight="600">Tope del mes</text>
<line x1="${xh}" y1="-4" x2="${xh}" y2="150" stroke="var(--dim)" stroke-dasharray="2 3"/><text x="${xh}" y="-8" text-anchor="middle" fill="var(--dim)">Hoy</text>
${r.recorte>0?`<polyline points="${xh},${yh} ${W},${yR}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="round"/>`:''}
<polyline points="${xh},${yh} ${W},${yP}" fill="none" stroke="var(--mal)" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round"/>
<polyline points="${pts}" fill="none" stroke="var(--tinta)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="${xh}" cy="${yh}" r="5" fill="var(--oro)" stroke="var(--tinta)" stroke-width="2"/>
<text x="${W}" y="${Math.max(8,yP-6)}" text-anchor="end" fill="var(--mal)" font-weight="700">${T(r.proy)}</text>
${r.recorte>0?`<text x="${W}" y="${yR+14}" text-anchor="end" fill="var(--ok)" font-weight="700">${T(r.proy-r.recorte)}</text>`:''}
<g fill="var(--dim)" text-anchor="middle">${marcas}</g></g></svg>
<div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin:2px 0 4px">
<span style="display:flex;align-items:center;gap:6px"><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--tinta)" stroke-width="3.5" stroke-linecap="round"/></svg>Gastado</span>
<span style="display:flex;align-items:center;gap:6px"><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--mal)" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/></svg>Al ritmo actual</span>
${r.recorte>0?'<span style="display:flex;align-items:center;gap:6px"><svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke="var(--ok)" stroke-width="3" stroke-dasharray="3 5" stroke-linecap="round"/></svg>Con recorte</span>':''}</div>`;
}
function recortesPorCat(r){
  const g=porGrupo(r.gm).filter(x=>{const c=S.cfg.cats.find(q=>(q.grupo||q.n)===x.n);return !c||c.g==='des'||true}).slice(0,2);
  const tot=g.reduce((s,x)=>s+x.v,0)||1;
  return g.map(x=>({n:x.n,v:Math.round(r.recorte*x.v/tot/10)*10}));
}
function textoProyeccion(r){
  const mes=MESES[+r.ym.slice(5,7)-1];
  if(r.gasto===0)return `El pergamino de ${mes} está limpio. Anota tu primer gasto, noble tesorero.`;
  if(r.dif>0)return `En ${mes}, tu bolsa se vaciaría ${mon(r.dif)} más allá del tope de ${mon(r.tope)}, si el oro corre a ${mon(r.ritmo)} por día. <b>Cuidado, caballero.</b>`;
  return `En ${mes}, tu cofre cerraría con ${mon(-r.dif)} de colchón. <b>¡Así se gobierna un reino!</b>`;
}

function diagnostico(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const l=[];
  l.push('Dirección: '+location.protocol+(location.protocol==='file:'?' (archivo local)':''));
  l.push('Conexión segura: '+(window.isSecureContext?'sí':'no'));
  l.push('Dictado del navegador: '+(SR?'disponible':'no disponible'));
  let msg='';
  if(!SR)msg='Este navegador no trae dictado propio. En Chrome de Android funciona. En iPhone usa el micrófono del teclado.';
  else if(!window.isSecureContext)msg='Chrome bloquea el micrófono en páginas que no son https ni localhost. Abre el gadget desde una dirección https.';
  else msg='Todo se ve bien. Si pide permiso, acéptalo. Si dice que no hay permiso, actívalo en la configuración del sitio.';
  return l.join('<br>')+'<br><b>'+msg+'</b><br>Plan B: toca el cuadro de texto y usa el micrófono del teclado del celular, luego pulsa Entender.';
}

/* ===== Excel (.xlsx) sin librerias ===== */
const CRC_T=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(), partes=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(([nombre,txt])=>{
    const nb=enc.encode(nombre), db=enc.encode(txt), c=crc32(db);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    partes.push(lh,nb,db);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=lh.length+nb.length+db.length;
  });
  let cs=0;central.forEach(x=>cs+=x.length);
  const fin=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cs),...u32(off),0,0]);
  return new Blob(partes.concat(central,[fin]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');

async function inflarRaw(u8){
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter();w.write(u8);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
async function leerZip(buf){
  const u=new Uint8Array(buf), dv=new DataView(buf), out={};
  let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;
  if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const dec=new TextDecoder();
  for(let i=0;i<n;i++){
    const met=dv.getUint16(p+10,true), csz=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const nom=dec.decode(u.subarray(p+46,p+46+nl));
    const lnl=dv.getUint16(lo+26,true), lel=dv.getUint16(lo+28,true), ini=lo+30+lnl+lel;
    const dat=u.subarray(ini,ini+csz);
    out[nom]={met,dat};
    p+=46+nl+el+cl;
  }
  out.__leer=async nom=>{const f=out[nom];if(!f)return null;return dec.decode(f.met===0?f.dat:await inflarRaw(f.dat))};
  return out;
}
async function leerXlsx(buf){
  const z=await leerZip(buf), P=new DOMParser();
  const dom=t=>P.parseFromString(t,'application/xml');
  const ss=[];const sst=await z.__leer('xl/sharedStrings.xml');
  if(sst){dom(sst).querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].map(t=>t.textContent).join('')))}
  const wb=dom(await z.__leer('xl/workbook.xml')), rels=dom(await z.__leer('xl/_rels/workbook.xml.rels'));
  const hs=[...wb.querySelectorAll('sheet')];
  let sh=hs.find(s=>/movim/i.test(s.getAttribute('name')))||hs[0];
  const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
  const rel=[...rels.querySelectorAll('Relationship')].find(r=>r.getAttribute('Id')===rid);
  let tg=rel.getAttribute('Target').replace(/^\//,'');if(!/^xl\//.test(tg))tg='xl/'+tg;
  const hoja=dom(await z.__leer(tg)), filas=[];
  hoja.querySelectorAll('row').forEach(r=>{
    const fila=[];
    r.querySelectorAll('c').forEach(c=>{
      const ref=c.getAttribute('r')||'', L=ref.replace(/\d/g,''); let ci=0;for(const ch of L)ci=ci*26+ch.charCodeAt(0)-64;ci--;
      const t=c.getAttribute('t'), v=c.querySelector('v'), is=c.querySelector('is');
      let val='';
      if(t==='s'&&v)val=ss[+v.textContent]||'';
      else if(t==='inlineStr'&&is)val=[...is.querySelectorAll('t')].map(x=>x.textContent).join('');
      else if(t==='str'||t==='e')val=v?v.textContent:'';
      else if(v)val=+v.textContent;
      fila[ci]=val;
    });
    for(let i=0;i<fila.length;i++)if(fila[i]===undefined)fila[i]='';
    filas.push(fila);
  });
  return filas;
}
function leerCsv(txt){
  txt=txt.replace(/^﻿/,'');
  const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  const filas=[];let fila=[],cel='',q=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cel+='"';i++}else q=false}else cel+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){fila.push(cel);cel=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;fila.push(cel);cel='';if(fila.some(x=>x!==''))filas.push(fila);fila=[]}
    else cel+=ch;
  }
  fila.push(cel);if(fila.some(x=>x!==''))filas.push(fila);
  return filas;
}

function fechaTexto(v,ref){
  if(typeof v==='number'&&v>20000)return fechaDeSerial(v);
  const s=String(v||'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if(m){let y=m[3]?+m[3]:+(ref||hoy()).slice(0,4);if(y<100)y+=2000;return y+'-'+pad(+m[2])+'-'+pad(+m[1])}
  return '';
}

  const out=[];
  filas.slice(1).forEach(r=>{
    if(!r.some(x=>x!==''&&x!=null))return;

    let t=ci.t>=0?norm(String(r[ci.t])).trim():'gasto'; t=t.startsWith('ing')?'ingreso':t.startsWith('tra')?'traspaso':'gasto';

/* arranque: decide entre lo local y lo de la nube */
function elegirInicial(loc){
  const nube=(SERV&&SERV.datos&&SERV.datos.v&&datosValidos(SERV.datos.datos))?SERV.datos:null;
  let pend=false,baseLS=0;
  try{pend=localStorage.getItem('fin_pend')==='1';baseLS=+localStorage.getItem('fin_base')||0}catch(e){}
  let res=null;
  if(nube&&!loc){res=nube.datos;BASE_V=nube.v}
  else if(!nube&&loc){res=loc;BASE_V=0;PEND=true}
  else if(nube&&loc){
    if(!pend||(loc.ts===nube.datos.ts)){res=nube.datos;BASE_V=nube.v}
    else if(baseLS===nube.v){res=loc;BASE_V=nube.v;PEND=true}
    else{res=nube.datos;BASE_V=nube.v;CONFLICTO={local:loc,nube:nube}}
  }else{SEMILLA=true;PEND=true}
  persistirFlags();
  return res;

}

  clearTimeout(syncT);

  syncT=setTimeout(()=>subir(),ms==null?SYNC_MS:ms);
}
function subir(forzar){
  if(!PEND||enVuelo)return;
  if(!hayNube()){estado2('off');return}
  enVuelo=true;
  const seq=EDIT_SEQ;
  const payload={baseV:BASE_V,forzar:!!forzar,semilla:SEMILLA&&seq===0,datos:S,quien:quienSoy()};
  google.script.run
    .withSuccessHandler(r=>{
      enVuelo=false;
      if(r&&r.ok){
        BASE_V=r.v;SEMILLA=false;ULTIMA=Date.now();
        if(seq===EDIT_SEQ){PEND=false;estado2('ok')}
        else{PEND=true;programarSync(400)}
        persistirFlags();
      }else if(r&&r.yaExistia){
        adoptar(r.actual);
      }else if(r&&r.conflicto){
        CONFLICTO={local:clon(S),nube:r.actual};
        estado2('pend');mostrarConflicto();
      }else{estado2('error')}
    })
    .withFailureHandler(err=>{
      enVuelo=false;
      if(ESTADO!=='error')toast('No se pudo guardar en la nube: '+limpiarError(err));
      estado2('error');
      clearTimeout(reintentoT);reintentoT=setTimeout(()=>subir(),REINTENTO_MS);
    })
    .guardarDatos(window.PIN,payload);
}

  enVuelo=true;
  google.script.run

async function leerCodigoZ(c){
  c=String(c||'').trim();
  if(!c.startsWith('FIN1Z.'))throw new Error('El código debe empezar con FIN1Z.');
  const bin=atob(c.slice(6)), u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'), w=ds.writable.getWriter();w.write(u);w.close();
  const txt=new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
  const d=JSON.parse(txt);
  if(!datosValidos(d))throw new Error('El código no tiene datos válidos');
  return d;
}

let ac=null, master=null, bus=null, timerM=null, sonando=false, ruido=null, ondas={};
const frec=m=>440*Math.pow(2,(m-69)/12);
function audio(){
  if(!ac){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    ac=new C();
    master=ac.createGain();
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
    master.connect(comp);comp.connect(ac.destination);
    bus=ac.createGain();bus.connect(master);
    // eco suave
    const dl=ac.createDelay(1);dl.delayTime.value=.27;const fb=ac.createGain();fb.gain.value=.34;const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;const env=ac.createGain();env.gain.value=.3;
    bus.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(env);env.connect(master);
    // ruido para percusión
    ruido=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=ruido.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    // onda de pulso al 25 % y 12,5 %
    [.25,.125].forEach(du=>{const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++){re[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*du);}ondas[du]=ac.createPeriodicWave(re,im)});

  }
  if(ac.state==='suspended')ac.resume();
  return ac;
}
function aplicarVol(){if(master)master.gain.value=(+S.cfg.vol/100)*.9}
function voz(o){
  // o: tipo | duty, f, t, d, g, att, rel, lp, vib
  const osc=ac.createOscillator(),e=ac.createGain();
  if(o.duty)osc.setPeriodicWave(ondas[o.duty]);else osc.type=o.tipo;
  osc.frequency.value=o.f;
  let out=osc;
  if(o.lp){const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;f.Q.value=2;osc.connect(f);out=f}
  if(o.vib){const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=5.5;lg.gain.value=o.f*.006;l.connect(lg);lg.connect(osc.frequency);l.start(o.t+.12);l.stop(o.t+o.d+.1)}
  const att=o.att||.008,rel=o.rel||.06;
  e.gain.setValueAtTime(0,o.t);e.gain.linearRampToValueAtTime(o.g,o.t+att);e.gain.setValueAtTime(o.g,Math.max(o.t+att,o.t+o.d-rel));e.gain.linearRampToValueAtTime(0,o.t+o.d);
  out.connect(e);e.connect(bus);osc.start(o.t);osc.stop(o.t+o.d+.05);
}
function perc(k,t){
  if(k==='k'){const o=ac.createOscillator(),e=ac.createGain();o.type='sine';o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);e.gain.setValueAtTime(.7,t);e.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(e);e.connect(master);o.start(t);o.stop(t+.2)}

}
const PISTAS=[
 {n:'Taberna alegre',bpm:138,drum:'jig',mel:[72,.5,76,.5,79,.5,76,.5,72,.5,76,.5,79,1,77,.5,81,.5,84,.5,81,.5,77,.5,81,.5,84,1,79,.5,83,.5,86,.5,83,.5,79,.5,83,.5,86,1,84,.5,79,.5,76,.5,79,.5,72,2],acA:[[48,0],[53,0],[55,0],[48,0]],acB:[[45,1],[53,0],[55,0],[48,0]]},
 {n:'Marcha del castillo',bpm:104,drum:'march',mel:[69,1,69,.5,72,.5,76,1,72,1,74,1,74,.5,77,.5,81,1,77,1,76,1,72,.5,69,.5,71,1,68,1,69,2,0,2],acA:[[45,1],[50,1],[52,1],[45,1]],acB:[[53,0],[55,0],[45,1],[52,0]]},
 {n:'Feria del pueblo',bpm:160,drum:'jig',mel:[67,.5,71,.5,74,.5,71,.5,67,.5,71,.5,74,1,72,.5,76,.5,79,.5,76,.5,72,.5,76,.5,79,1,74,.5,78,.5,81,.5,78,.5,74,.5,78,.5,81,1,79,1,74,1,71,1,67,1],acA:[[43,0],[48,0],[50,0],[43,0]],acB:[[52,1],[48,0],[50,0],[43,0]]}

function construir(p){
  const ev=[];let b=0;
  const notas=[];
  for(let i=0;i<p.mel.length;i+=2){notas.push([p.mel[i],p.mel[i+1]])}
  const rev=notas.slice().reverse();
  const sec=(lista,off,ac4)=>{
    let x=off;
    lista.forEach(([m,d])=>{if(m>0){ev.push({b:x,d:d*.95,k:'lead',m});ev.push({b:x,d:d*.95,k:'arm',m:m+12})}x+=d});
    ac4.forEach(([r,mn],i)=>{
      const o=off+i*4, terc=mn?3:4;
      [0,terc,7].forEach(n=>ev.push({b:o,d:3.9,k:'pad',m:r+12+n}));
      for(let k=0;k<4;k++){ev.push({b:o+k,d:.5,k:'bajo',m:k%2?r+7:r});ev.push({b:o+k+.5,d:.45,k:'bajo',m:k%2?r+12:r+7})}
      const arp=[0,terc,7,12,7,terc,0,terc];
      arp.forEach((n,j)=>ev.push({b:o+j*.5,d:.4,k:'arp',m:r+24+n}));
    });
  };
  sec(notas,0,p.acA);sec(rev,16,p.acB);
  for(let bar=0;bar<8;bar++){
    for(let k=0;k<4;k++){
      const t=bar*4+k;
      if(p.drum==='march'){if(k===0||k===2)ev.push({b:t,k:'k'});if(k===1||k===3)ev.push({b:t,k:'s'});ev.push({b:t+.5,k:'h'})}
      else{if(k===0||k===2)ev.push({b:t,k:'k'});if(k===1||k===3)ev.push({b:t,k:'s'});ev.push({b:t,k:'h'});ev.push({b:t+.5,k:'h'})}
    }
  }
  ev.sort((x,y)=>x.b-y.b);
  return {ev,len:32};
}
function tocar(e,t,bd){
  const d=(e.d||.25)*bd;
  if(e.k==='lead')voz({duty:.25,f:frec(e.m),t,d,g:.13,vib:1,att:.01,rel:.05});
  else if(e.k==='arm')voz({tipo:'triangle',f:frec(e.m),t,d,g:.05,att:.01});
  else if(e.k==='pad')voz({tipo:'sine',f:frec(e.m),t,d,g:.045,att:.25,rel:.4});
  else if(e.k==='bajo')voz({tipo:'sawtooth',f:frec(e.m),t,d,g:.11,lp:520,att:.005,rel:.04});
  else if(e.k==='arp')voz({duty:.125,f:frec(e.m),t,d,g:.035,att:.004,rel:.05});
  else perc(e.k,t);
}

}

let rec=null, escuchando=false;
const estado=t=>{const e=$('#estado');if(e)e.textContent=t};
function mic(){
  audio();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const d=$('#dictado');
  if(!SR){estado('Este navegador no trae dictado propio. Toca el cuadro de texto, usa el micrófono del teclado y pulsa Entender.');if(d)d.focus();return}
  if(!window.isSecureContext){estado('El navegador bloquea el micrófono porque esta página no es segura (https). Usa el micrófono del teclado y pulsa Entender.');if(d)d.focus();return}
  if(escuchando&&rec){rec.stop();return}
  rec=new SR();rec.lang='es-PE';rec.interimResults=true;rec.continuous=true;rec.maxAlternatives=1;
  let final='',oyo=false,tm=null;
  const cortar=ms=>{clearTimeout(tm);tm=setTimeout(()=>{try{rec.stop()}catch(x){}},ms)};cortar(9000);
  rec.onstart=()=>{estado('Te escucho, valiente. Habla ahora.')};
  rec.onaudiostart=()=>{oyo=true};
  rec.onresult=e=>{let t='';for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+' ';t=t.trim();if(d)d.value=t;final=t;estado('Escuché: '+t+'. Haz una pausa para terminar.');cortar(1900)};
  rec.onerror=e=>{
    const M={'not-allowed':(window.top!==window?'Google Apps Script bloquea el micrófono dentro de esta página. Usa el micrófono del teclado del celular en el cuadro de texto.':'No hay permiso para el micrófono. Actívalo en la configuración del sitio y recarga.'),'service-not-allowed':'Este navegador no deja usar el dictado aquí. Usa el micrófono del teclado.','no-speech':'No escuché nada. Acércate al micrófono y prueba otra vez.','audio-capture':'No encuentro un micrófono disponible.','network':'El dictado necesita internet. Revisa tu conexión.','language-not-supported':'El idioma no está disponible en este navegador.','aborted':'Se cortó el dictado.'};
    estado((M[e.error]||'El dictado falló ('+e.error+').')+' También puedes escribir y pulsar Entender.');
  };
  rec.onend=()=>{clearTimeout(tm);escuchando=false;const m=$('#mic');if(m)m.classList.remove('esc2');if(final)procesar(final);else if(!oyo)estado('El micrófono no llegó a abrirse. Usa el micrófono del teclado y pulsa Entender.')};
  try{rec.start();escuchando=true;$('#mic').classList.add('esc2');estado('Abriendo el micrófono, acepta el permiso si te lo pide.')}catch(err){estado('No pude abrir el micrófono ('+err.name+').')}
}
let colaForm=[];
function describir(r){
  const tn={gasto:'un gasto',ingreso:'un ingreso',traspaso:'un traspaso'}[r.tipo];
  const dia=r.fecha===hoy()?'de hoy':'del '+fechaLarga(r.fecha);
  const extra=r.tipo==='gasto'?(r.cat?' en '+r.cat+(r.sub.length?' ('+r.sub.join(', ')+')':''):''):r.tipo==='traspaso'?' de '+cuenta(r.c).n+' a '+cuenta(r.c2).n:' en '+cuenta(r.c).n;
  return tn+(r.monto>0?' de S/ '+fmt(r.monto):'')+extra+', '+dia;
}
function formDesde(r,msg,n,tot){
  return {t:r.tipo,m:r.monto||'',f:r.fecha,cat:r.cat,s:r.sub,nota:r.nota,c:r.c,c2:r.c2,voz:true,msg,pista:r.pista||'',recordar:true,n,tot};
}
function procesar(texto){
  const arr=entenderMulti(texto);
  colaForm=arr.slice(1).map((r,i)=>formDesde(r,'Siguiente movimiento detectado.',i+2,arr.length));
  const r=arr[0];
  let msg='Entendí '+describir(r)+'.';
  if(arr.length>1)msg='Detecté '+arr.length+' movimientos. Este es el 1 de '+arr.length+': '+describir(r)+'.';
  if(r.aviso)msg+=' '+r.aviso;
  abrirForm(formDesde(r,msg,1,arr.length));
}
function pregunta(f){
  const q=[];
  if(!f.voz)return q;
  if(!(num(f.m)>0))q.push('¿Cuánto costó? Escribe el monto en soles.');
  if(f.t==='gasto'&&!f.cat)q.push(f.pista?'No conozco «'+f.pista+'». ¿En qué categoría lo pongo? Elígela abajo y la próxima vez lo entenderé solo.':'¿En qué categoría lo pongo? Elígela abajo.');
  return q;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f&&formMov&&t.type!=='checkbox'){formMov[t.dataset.f]=t.value}
  if(t.id==='vol'){S.cfg.vol=+t.value;aplicarVol()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='archivo'){
    const fl=t.files&&t.files[0];if(!fl)return;
    try{
      let filas;
      if(/\.xlsx$/i.test(fl.name))filas=await leerXlsx(await fl.arrayBuffer());
      else filas=leerCsv(await fl.text());
      const items=itemsDesdeFilas(filas);
      if(!items||!items.length){toast('No encontré las columnas Fecha y Monto');return}
      imp={items};capa='importar';render();
    }catch(err){toast('No pude leer ese archivo. Prueba con la plantilla')}
    return;
  }
  if(t.id==='vol'){guardar();return}
  if(t.dataset.f&&formMov){formMov[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;if(['c','c2'].includes(t.dataset.f))renderCapa();return}
  if(t.dataset.p){
    let v=t.value;
    if(t.dataset.t==='n')v=num(v);
    else if(t.dataset.t==='csv')v=v.split(',').map(s=>s.trim()).filter(Boolean);
    const p=t.dataset.p, mc=p.match(/^cfg\.cats\.(\d+)\.n$/);
    mutar(()=>{
      if(mc){const viejo=S.cfg.cats[+mc[1]].n;S.movs.forEach(x=>{if(x.cat===viejo)x.cat=v})}
      setPath(S,p,v);
    });
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dictado'){e.preventDefault();ACT.entender()}});

function iniciarNube(){
  window.addEventListener('online',()=>{if(PEND)subir();else traer()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-ULTRAER>60000){if(PEND)subir();else traer()}});
  setInterval(()=>{if(PEND)subir();else traer()},REFRESCO_MS);

  if(!hayNube()){estado2('off');return}
  if(CONFLICTO){estado2('pend');mostrarConflicto();return}

  ULTIMA=Date.now();estado2('ok');
}

<script>
/* Versión para hosting propio: habla con Apps Script por fetch, sin cuentas de Google. */
const API_URL='https://script.google.com/macros/s/AKfycbyo2URwVen4rjsWcJGlQ9VYl_p46VgEQy6ygdZu_kbI9ZEBSA2tHhOfYLzdm0CgH3sO/exec';
(function(){
  var url=API_URL;
  try{var q=new URLSearchParams(location.search).get('api');if(q){url=q;localStorage.setItem('fin_api',q)}else{var g=localStorage.getItem('fin_api');if(g)url=g}}catch(e){}
  function mk(ok,ko){
    return new Proxy({},{get:function(t,k){
      if(k==='withSuccessHandler')return function(f){return mk(f,ko)};
      if(k==='withFailureHandler')return function(f){return mk(ok,f)};
      return function(){
        var args=Array.prototype.slice.call(arguments);
        fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:k,args:args}),redirect:'follow',credentials:'omit'})
          .then(function(r){return r.text()})
          .then(function(t){var r;try{r=JSON.parse(t)}catch(e){throw new Error('La nube no respondió bien. Revisa que la implementación diga Cualquier persona.')}
            if(r&&r.err)throw new Error(r.err);if(ok)ok(r.ok)})
          .catch(function(e){if(ko)ko({message:(e&&e.message)||String(e)})});
      }
    }});
  }
  window.google={script:{run:mk(null,null)}};
})();
</script>
<script>
function arrancarApp(d){try{window.SERV=d||{datos:null,usuario:""};var s=document.createElement("script");s.text=document.getElementById("app-src").textContent;document.body.appendChild(s)}catch(x){var e=document.createElement("div");e.style.cssText="position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#fff3cd;color:#3b2a1a;border:2px solid #c0392b;border-radius:12px;padding:10px;font:13px/1.4 system-ui,sans-serif";e.textContent="Error al arrancar: "+x.message;document.body.appendChild(e)}}
(function(){
var LSK="fin_pin";
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
if(!(window.google&&google.script&&google.script.run)){arrancarApp(null);return}
var capa=null;
function quitar(){if(capa){capa.remove();capa=null}}
function pantalla(msg){
  quitar();
  capa=document.createElement("div");
  capa.style.cssText="position:fixed;inset:0;z-index:99998;display:flex;align-items:center;justify-content:center;background:#e3f1dc;font-family:Poppins,system-ui,sans-serif;color:#3b2a1a";
  capa.innerHTML='<form id="pinf" style="width:min(340px,86vw);padding:22px;border:3px solid #9a6b3a;border-radius:20px;background:#f8edcf;box-shadow:0 6px 0 #9a6b3a55"><h1 style="margin:0 0 6px;font-size:19px">Mi organizador</h1><p style="margin:0 0 12px;font-size:13.5px;line-height:1.45">Escribe tu PIN para abrir las finanzas.</p><input id="pinv" type="password" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:2px solid #9a6b3a;border-radius:12px;background:#fffaf0"><label style="display:flex;gap:8px;align-items:center;margin:10px 0;font-size:13px"><input id="pinr" type="checkbox" checked> Recordar en este aparato</label><button style="width:100%;padding:12px;font-size:15px;font-weight:600;border:2px solid #9a6b3a;border-radius:12px;background:#f2c14e;color:#3b2a1a">Entrar</button><p id="pinm" style="margin:10px 0 0;font-size:12.5px;color:#a33;min-height:16px"></p></form>';
  document.body.appendChild(capa);
  var m=capa.querySelector("#pinm");m.textContent=msg||"";
  var inp=capa.querySelector("#pinv");inp.focus();
  capa.querySelector("#pinf").onsubmit=function(ev){ev.preventDefault();var p=inp.value;if(!p)return;m.style.color="#3b2a1a";m.textContent="Comprobando...";intentar(p,capa.querySelector("#pinr").checked)}
}
function intentar(pin,rec){
  google.script.run.withSuccessHandler(function(r){
    if(r&&r.datos!==undefined){window.PIN=pin;if(rec)ls(LSK,pin);quitar();arrancarApp(r);return}
    ls(LSK,null);
    if(r&&r.error==="pin")pantalla("PIN incorrecto. Te quedan "+r.quedan+(r.quedan===1?" intento.":" intentos."));
    else if(r&&r.error==="bloqueo")pantalla("Demasiados intentos. Espera "+r.min+" min y vuelve a probar.");
    else pantalla((r&&r.mensaje)||"No se pudo abrir la hoja de datos.");
  }).withFailureHandler(function(er){pantalla("No se pudo conectar: "+((er&&er.message)||er))}).inicio(pin)
}
var g=ls(LSK);
if(g)intentar(g,true);else pantalla("");
})();
</script>
